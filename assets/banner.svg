<svg width="1600" height="500" viewBox="0 0 1600 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">MIMRY — Local repo memory for coding agents</title>
  <desc id="desc">A dark technical banner with a graph compass, code cards, and the MIMRY wordmark.</desc>
  <defs>
    <radialGradient id="glowCyan" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1090 220) rotate(126) scale(520 380)">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.42"/>
      <stop offset="0.45" stop-color="#7C3AED" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowAmber" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(420 132) rotate(90) scale(260 360)">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.45" stop-color="#08111F"/>
      <stop offset="1" stop-color="#0B1026"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="154" y1="177" x2="638" y2="177" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="0.62" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <linearGradient id="line" x1="780" y1="80" x2="1390" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0.15"/>
      <stop offset="0.48" stop-color="#A78BFA" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" stroke="#94A3B8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="500" fill="url(#bg)"/>
  <rect width="1600" height="500" fill="url(#grid)"/>
  <rect width="1600" height="500" fill="url(#glowCyan)"/>
  <rect width="1600" height="500" fill="url(#glowAmber)"/>

  <g opacity="0.28">
    <path d="M-20 414C178 334 283 380 473 298C645 224 780 102 988 128C1160 150 1298 276 1622 198" stroke="#38BDF8" stroke-opacity="0.32" stroke-width="2"/>
    <path d="M-40 94C158 176 328 146 511 206C728 277 871 420 1110 378C1305 344 1424 222 1648 264" stroke="#A78BFA" stroke-opacity="0.22" stroke-width="2"/>
  </g>

  <g transform="translate(134 116)">
    <text x="0" y="92" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="104" font-weight="850" letter-spacing="10" fill="url(#wordmark)">MIMRY</text>
    <text x="4" y="148" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="31" font-weight="550" letter-spacing="0.5" fill="#CBD5E1">Local repo memory for coding agents</text>
    <g transform="translate(6 195)">
      <rect x="0" y="0" width="118" height="34" rx="17" fill="#0F172A" stroke="#22D3EE" stroke-opacity="0.42"/>
      <text x="22" y="23" font-family="Inter, ui-sans-serif, system-ui" font-size="14" font-weight="700" fill="#67E8F9">Index</text>
      <path d="M128 17H172" stroke="#64748B" stroke-width="2" stroke-dasharray="5 7"/>
      <rect x="184" y="0" width="118" height="34" rx="17" fill="#111827" stroke="#A78BFA" stroke-opacity="0.48"/>
      <text x="212" y="23" font-family="Inter, ui-sans-serif, system-ui" font-size="14" font-weight="700" fill="#C4B5FD">Graph</text>
      <path d="M312 17H356" stroke="#64748B" stroke-width="2" stroke-dasharray="5 7"/>
      <rect x="368" y="0" width="132" height="34" rx="17" fill="#111827" stroke="#F59E0B" stroke-opacity="0.48"/>
      <text x="394" y="23" font-family="Inter, ui-sans-serif, system-ui" font-size="14" font-weight="700" fill="#FBBF24">Context</text>
      <path d="M510 17H554" stroke="#64748B" stroke-width="2" stroke-dasharray="5 7"/>
      <rect x="566" y="0" width="136" height="34" rx="17" fill="#0F172A" stroke="#22D3EE" stroke-opacity="0.38"/>
      <text x="591" y="23" font-family="Inter, ui-sans-serif, system-ui" font-size="14" font-weight="700" fill="#BAE6FD">Feedback</text>
    </g>
  </g>

  <g transform="translate(822 68)" filter="url(#shadow)">
    <g opacity="0.92">
      <path d="M302 43L424 112L482 230L410 337L282 365L162 298L116 166L184 76L302 43Z" stroke="url(#line)" stroke-width="3"/>
      <path d="M184 76L282 365M424 112L162 298M116 166L482 230M302 43L410 337" stroke="#38BDF8" stroke-opacity="0.26" stroke-width="2"/>
      <path d="M184 76L424 112L410 337L162 298L184 76Z" stroke="#A78BFA" stroke-opacity="0.45" stroke-width="2"/>
      <path d="M302 43L482 230L282 365L116 166L302 43Z" stroke="#22D3EE" stroke-opacity="0.28" stroke-width="2"/>
    </g>

    <g filter="url(#softGlow)">
      <circle cx="302" cy="43" r="9" fill="#67E8F9"/>
      <circle cx="424" cy="112" r="7" fill="#C4B5FD"/>
      <circle cx="482" cy="230" r="9" fill="#67E8F9"/>
      <circle cx="410" cy="337" r="7" fill="#FBBF24"/>
      <circle cx="282" cy="365" r="9" fill="#A78BFA"/>
      <circle cx="162" cy="298" r="7" fill="#67E8F9"/>
      <circle cx="116" cy="166" r="8" fill="#A78BFA"/>
      <circle cx="184" cy="76" r="7" fill="#FBBF24"/>
      <circle cx="300" cy="210" r="12" fill="#F8FAFC"/>
    </g>

    <g transform="translate(40 240) rotate(-8)">
      <rect width="190" height="118" rx="18" fill="#0F172A" fill-opacity="0.88" stroke="#334155"/>
      <rect x="18" y="22" width="58" height="8" rx="4" fill="#38BDF8" fill-opacity="0.86"/>
      <rect x="18" y="45" width="138" height="7" rx="3.5" fill="#64748B" fill-opacity="0.7"/>
      <rect x="18" y="65" width="102" height="7" rx="3.5" fill="#64748B" fill-opacity="0.55"/>
      <rect x="18" y="85" width="128" height="7" rx="3.5" fill="#64748B" fill-opacity="0.45"/>
    </g>

    <g transform="translate(440 48) rotate(9)">
      <rect width="170" height="104" rx="18" fill="#111827" fill-opacity="0.9" stroke="#334155"/>
      <path d="M46 64L26 52L46 40" stroke="#A78BFA" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M124 40L144 52L124 64" stroke="#22D3EE" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M96 30L74 76" stroke="#FBBF24" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>

  <g opacity="0.55">
    <circle cx="1480" cy="72" r="2" fill="#67E8F9"/>
    <circle cx="1436" cy="410" r="2" fill="#C4B5FD"/>
    <circle cx="76" cy="74" r="2" fill="#FBBF24"/>
    <circle cx="705" cy="430" r="2" fill="#67E8F9"/>
    <circle cx="1220" cy="36" r="1.5" fill="#E2E8F0"/>
  </g>
</svg>
