[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mimry"
version = "0.1.0"
description = "Modular Intelligence Memory for Repos"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastmcp>=3.4.2",
    # Upper-bounded on purpose. The grammars in tree-sitter-language-pack are
    # compiled against a specific core ABI; a 0.26 core can import cleanly and
    # still return a different parse tree, which would move symbol identities,
    # line pointers, and the canonical digest without any MIMRY change. Import
    # success is not proof of parser compatibility, so the unlocked-artifact CI
    # lane runs the full parser and determinism suite rather than one import.
    # Widen this only together with a re-run of that lane.
    "tree-sitter>=0.25.2,<0.26",
    # 1.13.x changes the TSX grammar shape and breaks exported function/component
    # extraction. Keep the version proved by the locked and unlocked artifact tests.
    "tree-sitter-language-pack==1.12.2",
]

[project.scripts]
mimry = "mimry.cli:main"
mimry-mcp = "mimry.mcp_server:main"
mimry-integration-smoke = "mimry.agent_integration:main"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=8",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.hatch.build.targets.wheel]
packages = ["src/mimry"]

# Keep source releases reviewable. Generated state, local work products, and
# generated state are intentionally omitted.
[tool.hatch.build.targets.sdist]
include = [
    "/src/mimry",
    "/tests",
    "/scripts/agent_integration_smoke.py",
    "/scripts/agent_usefulness_benchmark.py",
    # The determinism gate ships with the source so a released artifact can be
    # re-verified, not just the working checkout.
    "/scripts/cross_platform_check.py",
    "/scripts/determinism_matrix.py",
    "/benchmarks",
    "/docs",
    "/assets/banner.svg",
    "/README.md",
    "/CHANGELOG.md",
    "/RELEASING.md",
    "/THIRD_PARTY.md",
    "/LICENSE",
    "/pyproject.toml",
]
exclude = ["/tests/fixtures/**/.env"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["vendor", "benchmarks/fixtures", ".claude"]

[tool.ruff.lint]
# Was ["E9", "F63", "F7", "F82"] -- syntax errors and a couple of bug patterns only,
# which is why six dead imports/variables accumulated without a single warning.
# F catches unused and undefined names, B catches real bug shapes.
select = ["E4", "E7", "E9", "F", "B", "C901"]

[tool.ruff.lint.mccabe]
# A ratchet, not a target. The pipeline functions currently peak at 31
# (scanner.adapt); this stops anything getting worse while they come down.
max-complexity = 31
