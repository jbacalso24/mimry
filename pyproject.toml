[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mimry"
version = "0.1.0"
description = "Modular Intelligence Memory for Repos"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastmcp>=3.4.2",
    "tree-sitter>=0.25.2",
    # 1.13.x changes the TSX grammar shape and breaks exported function/component
    # extraction. Keep the version proved by the locked and unlocked artifact tests.
    "tree-sitter-language-pack==1.12.2",
]

[project.scripts]
mimry = "mimry.cli:main"
mimry-mcp = "mimry.mcp_server:main"
mimry-integration-smoke = "mimry.agent_integration:main"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=8",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.hatch.build.targets.wheel]
packages = ["src/mimry"]

# Keep source releases reviewable. Generated state, local work products, and
# generated state are intentionally omitted.
[tool.hatch.build.targets.sdist]
include = [
    "/src/mimry",
    "/tests",
    "/scripts/agent_integration_smoke.py",
    "/scripts/agent_usefulness_benchmark.py",
    "/benchmarks",
    "/docs",
    "/assets/banner.svg",
    "/README.md",
    "/CHANGELOG.md",
    "/RELEASING.md",
    "/THIRD_PARTY.md",
    "/LICENSE",
    "/pyproject.toml",
]
exclude = ["/tests/fixtures/**/.env"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["vendor", "benchmarks/fixtures"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
