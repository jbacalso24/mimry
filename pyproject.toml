[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mimry"
version = "0.1.0"
description = "Modular Intelligence Memory for Repos"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastmcp>=3.4.2",
    "graphifyy",
]

[project.scripts]
mimry = "mimry.cli:main"
mimry-mcp = "mimry.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.uv.sources]
graphifyy = { path = "vendor/graphify", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
