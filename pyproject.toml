[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mimry"
version = "0.1.0"
description = "Modular Intelligence Memory for Repos"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastmcp>=3.4.2",
    "graphifyy",
    "tree-sitter>=0.25.2",
    "tree-sitter-language-pack>=1.12.2",
]

[project.scripts]
mimry = "mimry.cli:main"
mimry-mcp = "mimry.mcp_server:main"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=8",
    "ruff>=0.8",
]

[tool.uv.sources]
graphifyy = { git = "https://github.com/safishamsi/graphify.git", rev = "44c0a5e33c7011813dcebf1a8850c1c6005bf500" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
