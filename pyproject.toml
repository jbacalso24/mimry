[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mimry"
version = "0.2.2"
description = "Modular Intelligence Memory for Repos"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["coding-agents", "mcp", "repository-intelligence", "semantic-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
authors = [{ name = "Judison Bacalso", email = "judisonbacalso24@gmail.com" }]
dependencies = [
    "fastmcp>=3.4.2",
    "pypdf>=6.19,<7",
    # Upper-bounded on purpose. The grammars in tree-sitter-language-pack are
    # compiled against a specific core ABI; a 0.26 core can import cleanly and
    # still return a different parse tree, which would move symbol identities,
    # line pointers, and the canonical digest without any MIMRY change. Import
    # success is not proof of parser compatibility, so the unlocked-artifact CI
    # lane runs the full parser and determinism suite rather than one import.
    # Widen this only together with a re-run of that lane.
    "tree-sitter>=0.25.2,<0.26",
    # 1.13.x changes the TSX grammar shape and breaks exported function/component
    # extraction. Keep the version proved by the locked and unlocked artifact tests.
    "tree-sitter-language-pack==1.12.2",
]

[project.urls]
Homepage = "https://jbacalso24.github.io/mimry/"
Repository = "https://github.com/jbacalso24/mimry"
Issues = "https://github.com/jbacalso24/mimry/issues"
GitHub = "https://github.com/jbacalso24"

[project.scripts]
mimry = "mimry.cli:main"
mimry-mcp = "mimry.mcp_server:main"
mimry-integration-smoke = "mimry.agent_integration:main"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=8",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.hatch.build.targets.wheel]
packages = ["src/mimry"]

# Keep source releases reviewable. Generated state, local work products, and
# generated state are intentionally omitted.
[tool.hatch.build.targets.sdist]
include = [
    "/src/mimry",
    "/tests",
    "/scripts/agent_integration_smoke.py",
    "/scripts/agent_usefulness_benchmark.py",
    # The determinism gate ships with the source so a released artifact can be
    # re-verified, not just the working checkout.
    "/scripts/cross_platform_check.py",
    "/scripts/determinism_aggregate.py",
    "/scripts/determinism_matrix.py",
    "/benchmarks",
    "/docs",
    "/assets/banner.svg",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/RELEASING.md",
    "/SECURITY.md",
    "/THIRD_PARTY.md",
    "/LICENSE",
    "/pyproject.toml",
]
exclude = ["/tests/fixtures/**/.env"]

[tool.ruff]
line-length = 99
target-version = "py311"
extend-exclude = ["benchmarks/fixtures", ".claude", "tests/fixtures"]

[tool.ruff.lint]
# PEP 8 compliance: style (E, W), undefined/unused names (F), likely bugs (B),
# naming conventions (N), import sorting (I), modernization (UP), and mccabe.
select = ["E", "W", "F", "B", "N", "I", "UP", "C901"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.lint.mccabe]
# A ratchet, not a target. The pipeline functions currently peak at 31
# (scanner.adapt); this stops anything getting worse while they come down.
max-complexity = 31
