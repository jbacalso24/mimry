name: Feature request
description: Suggest a new command, tool, output or change in how MIMRY works.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem you hit
      description: What you were trying to do, and where MIMRY got in the way.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What you do today instead
      description: Optional. The workaround you use now.
    validations:
      required: false
  - type: textarea
    id: want
    attributes:
      label: What you would like MIMRY to do
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent or editor you use
      description: Optional. Name and version, if it matters for the request.
    validations:
      required: false
