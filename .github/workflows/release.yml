name: Release

# Tag-driven release: `git tag vX.Y.Z && git push origin vX.Y.Z` builds the
# artifacts once, publishes them to PyPI via Trusted Publishing (OIDC, no
# stored token), and attaches them to the GitHub Release for that tag.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write   # create the GitHub Release and upload assets
      id-token: write   # PyPI Trusted Publishing via OIDC
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Verify tag matches pyproject version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "tag=$tag pyproject=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject version $pkg. Bump pyproject.toml or retag."
            exit 1
          fi

      - name: Build reproducible artifacts
        run: |
          rm -rf dist
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" uv build

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        # No password: OIDC identity is exchanged for a short-lived token.
        # Requires a Trusted Publisher configured on PyPI for this repo/workflow.

      - name: Publish GitHub Release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
