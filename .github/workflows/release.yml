name: Release

# Tag-driven release: `git tag vX.Y.Z && git push origin vX.Y.Z` builds the
# artifacts once, publishes them to PyPI via Trusted Publishing (OIDC, no
# stored token), and attaches them to the GitHub Release for that tag.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write   # create the GitHub Release and upload assets
      id-token: write   # PyPI Trusted Publishing via OIDC
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Verify tag matches pyproject version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "tag=$tag pyproject=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject version $pkg. Bump pyproject.toml or retag."
            exit 1
          fi

      - name: Build reproducible artifacts
        run: |
          rm -rf dist
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" uv build

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        # No password: OIDC identity is exchanged for a short-lived token.
        # Requires a Trusted Publisher configured on PyPI for this repo/workflow.

      - name: Publish GitHub Release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          # Not dist/*: uv build also writes dist/.gitignore, which would be uploaded as an asset.
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true

  aur-build:
    # Arch users install with `yay -S mimry`. Render the AUR package for the
    # sdist just published to PyPI, then build, install and smoke-test it on
    # Arch. Everything but pacman runs as an unprivileged user.
    needs: release
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 20
    steps:
      - name: Install Arch build tools
        run: pacman -Syu --noconfirm --needed base-devel git pacman-contrib python python-build python-hatchling python-pip uv

      - uses: actions/checkout@v4

      - name: Render, build, install and smoke-test the package
        run: |
          version="${GITHUB_REF_NAME#v}"
          useradd -m builder
          cp -r "$GITHUB_WORKSPACE" /home/builder/mimry
          chown -R builder: /home/builder/mimry
          sudo -u builder bash /home/builder/mimry/packaging/aur/update.sh "$version" /home/builder/aur
          cd /home/builder/aur
          sudo -u builder makepkg --noconfirm
          pacman -U --noconfirm "mimry-$version-"*.pkg.tar.zst
          sudo -u builder bash /home/builder/mimry/packaging/aur/smoke.sh "$version"
          mkdir "$GITHUB_WORKSPACE/aur-package"
          cp PKGBUILD .SRCINFO requirements-*.txt "$GITHUB_WORKSPACE/aur-package/"

      - uses: actions/upload-artifact@v4
        with:
          name: aur-package
          path: aur-package
          include-hidden-files: true   # .SRCINFO
          if-no-files-found: error

  aur-publish:
    # Pushes the tested package files to the AUR. Kept apart from the build so
    # the SSH key never shares a job with downloaded code.
    needs: aur-build
    runs-on: ubuntu-latest
    environment: aur
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aur-package
          path: aur-package

      - name: Push to the AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::notice::AUR_SSH_PRIVATE_KEY is not set, so the AUR package was built and tested but not published."
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          ssh_dir="$(mktemp -d)"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$ssh_dir/key"
          chmod 600 "$ssh_dir/key"
          # Trust only the Ed25519 host key fingerprint published on https://aur.archlinux.org.
          ssh-keyscan -t ed25519 aur.archlinux.org > "$ssh_dir/known_hosts"
          if ! ssh-keygen -lf "$ssh_dir/known_hosts" | grep -q "SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4"; then
            echo "::error::aur.archlinux.org presented an unexpected host key."
            exit 1
          fi
          export GIT_SSH_COMMAND="ssh -i $ssh_dir/key -o IdentitiesOnly=yes -o UserKnownHostsFile=$ssh_dir/known_hosts -o StrictHostKeyChecking=yes"
          git clone ssh://aur@aur.archlinux.org/mimry.git aur-repo
          cd aur-repo
          git rm -q --ignore-unmatch 'requirements-*.txt'
          cp ../aur-package/PKGBUILD ../aur-package/.SRCINFO ../aur-package/requirements-*.txt .
          git add PKGBUILD .SRCINFO requirements-*.txt
          if git diff --cached --quiet; then
            echo "The AUR already has mimry $version."
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "Update to $version"
            git push origin HEAD:master
          fi
