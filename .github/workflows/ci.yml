name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-floor:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked environment
        run: uv sync --locked --python "${{ matrix.python-version }}"

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

      # Fast portable check on fixed in-memory input, then the real gate: the
      # whole pipeline (scanner, parsers, graph, SQLite/FTS, semantic, context
      # pack) over the frozen fixture, once per permutation of creation order,
      # checkout root, hash seed, and locale, compared against the committed
      # golden digest.
      - name: Cross-platform graph identity
        run: uv run python scripts/cross_platform_check.py

      - name: Real end-to-end determinism matrix
        run: uv run python scripts/determinism_matrix.py --emit digest-${{ matrix.os }}-${{ matrix.python-version }}.json

      # Printing a digest per job proves nothing on its own -- nothing compares
      # them. Upload each, then the aggregate job below actually diffs them.
      - name: Upload canonical digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.os }}-${{ matrix.python-version }}
          path: digest-${{ matrix.os }}-${{ matrix.python-version }}.json
          if-no-files-found: error

      - name: Test unlocked extracted artifact with an empty cache
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .artifact-src .artifact-venv .artifact-uv-cache
          mkdir .artifact-src .artifact-uv-cache
          uv build
          tar -xzf dist/*.tar.gz -C .artifact-src
          artifact_root="$(find .artifact-src -mindepth 1 -maxdepth 1 -type d -print -quit)"
          UV_CACHE_DIR="$PWD/.artifact-uv-cache" uv venv .artifact-venv --python "${{ matrix.python-version }}"
          # uv puts the interpreter in Scripts/ on Windows and bin/ elsewhere.
          venv_python=".artifact-venv/bin/python"
          [ -x ".artifact-venv/Scripts/python.exe" ] && venv_python=".artifact-venv/Scripts/python.exe"
          UV_CACHE_DIR="$PWD/.artifact-uv-cache" uv --no-cache pip install \
            --python "$venv_python" "$artifact_root" pytest
          # Run from outside the checkout so the installed artifact is exercised
          # rather than the working tree. TMPDIR is portable; /tmp is not.
          scratch="$(mktemp -d)"
          (
            cd "$scratch"
            "$GITHUB_WORKSPACE/$venv_python" -m pytest -q \
              "$GITHUB_WORKSPACE/$artifact_root/tests/test_mimry_cli.py::test_typescript_ast_extracts_tsx_symbols"
          )

      - name: Install and smoke-test the wheel
        shell: bash
        run: |
          set -euo pipefail
          uv venv .wheel-venv --python "${{ matrix.python-version }}"
          venv_python=".wheel-venv/bin/python"
          mimry_exe=".wheel-venv/bin/mimry"
          if [ -x ".wheel-venv/Scripts/python.exe" ]; then
            venv_python=".wheel-venv/Scripts/python.exe"
            mimry_exe=".wheel-venv/Scripts/mimry.exe"
          fi
          uv pip install --python "$venv_python" dist/*.whl
          "$mimry_exe" --help >/dev/null

  determinism-aggregate:
    name: Compare canonical digests across every platform
    needs: release-floor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Download every platform digest
        uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      # The point of the whole exercise. Every OS and Python version must have
      # produced one canonical digest, and it must be the same one, and it must
      # equal the value committed in the repository.
      - name: Assert one digest across the matrix
        shell: python
        run: |
          import json, pathlib, sys

          golden = json.loads(pathlib.Path("tests/fixtures/determinism_golden.json").read_text())["canonicalDigest"]
          reports = sorted(pathlib.Path("digests").glob("*.json"))
          if not reports:
              sys.exit("no digest artifacts were collected; the matrix jobs did not emit any")

          seen = {}
          for report in reports:
              payload = json.loads(report.read_text())
              seen[report.stem] = payload["digest"]
              print(f"{report.stem:44s} {payload['digest']}")

          distinct = sorted(set(seen.values()))
          print(f"\n{len(seen)} jobs, {len(distinct)} distinct digest(s)")
          if len(distinct) != 1:
              sys.exit(f"canonical digests diverge across platforms: {distinct}")
          if distinct[0] != golden:
              sys.exit(f"canonical digest {distinct[0]} does not match committed golden {golden}")
          print(f"all platforms agree and match the committed golden digest {golden}")
