name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-floor:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked environment
        run: uv sync --locked --python "${{ matrix.python-version }}"

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

      # Fast portable check on fixed in-memory input, then the real gate: the
      # whole pipeline (scanner, parsers, graph, SQLite/FTS, semantic, context
      # pack) over the frozen fixture, once per permutation of creation order,
      # checkout root, hash seed, and locale, compared against the committed
      # golden digest.
      - name: Cross-platform graph identity
        run: uv run python scripts/cross_platform_check.py

      - name: Real end-to-end determinism matrix
        run: uv run python scripts/determinism_matrix.py --emit digest-${{ matrix.os }}-${{ matrix.python-version }}.json

      # Printing a digest per job proves nothing on its own -- nothing compares
      # them. Upload each, then the aggregate job below actually diffs them.
      - name: Upload canonical digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.os }}-${{ matrix.python-version }}
          path: digest-${{ matrix.os }}-${{ matrix.python-version }}.json
          if-no-files-found: error

      # The sdist ships no uv.lock, so this lane resolves dependencies fresh --
      # it is the only place a newer parser release would first show up. One
      # TSX test was not enough: a grammar can import fine and still parse
      # differently. Run the whole parser and determinism surface here.
      - name: Test unlocked extracted artifact with an empty cache
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .artifact-src .artifact-venv .artifact-uv-cache
          mkdir .artifact-src .artifact-uv-cache
          uv build
          tar -xzf dist/*.tar.gz -C .artifact-src
          artifact_root="$(find .artifact-src -mindepth 1 -maxdepth 1 -type d -print -quit)"
          UV_CACHE_DIR="$PWD/.artifact-uv-cache" uv venv .artifact-venv --python "${{ matrix.python-version }}"
          # uv puts the interpreter in Scripts/ on Windows and bin/ elsewhere.
          venv_python=".artifact-venv/bin/python"
          [ -x ".artifact-venv/Scripts/python.exe" ] && venv_python=".artifact-venv/Scripts/python.exe"
          UV_CACHE_DIR="$PWD/.artifact-uv-cache" uv --no-cache pip install \
            --python "$venv_python" "$artifact_root" pytest
          "$venv_python" -c "from importlib.metadata import version; print('unlocked tree-sitter', version('tree-sitter')); print('unlocked language-pack', version('tree-sitter-language-pack'))"
          # Run from outside the checkout so the installed artifact is exercised
          # rather than the working tree. TMPDIR is portable; /tmp is not.
          scratch="$(mktemp -d)"
          (
            cd "$scratch"
            "$GITHUB_WORKSPACE/$venv_python" -m pytest -q \
              "$GITHUB_WORKSPACE/$artifact_root/tests/test_mimry_cli.py" \
              "$GITHUB_WORKSPACE/$artifact_root/tests/test_languages_selfchecks.py" \
              "$GITHUB_WORKSPACE/$artifact_root/tests/test_adapters.py" \
              "$GITHUB_WORKSPACE/$artifact_root/tests/test_symbol_text_offsets.py" \
              "$GITHUB_WORKSPACE/$artifact_root/tests/test_graph_correctness_regressions.py" \
              "$GITHUB_WORKSPACE/$artifact_root/tests/test_determinism_identity.py" \
              "$GITHUB_WORKSPACE/$artifact_root/tests/test_determinism_graph.py" \
              "$GITHUB_WORKSPACE/$artifact_root/tests/test_determinism_retrieval.py"
          )
          # Canonical digest under unlocked resolution must equal the golden
          # value: a parser change that moves symbols or line pointers lands here.
          PYTHONPATH="$GITHUB_WORKSPACE/$artifact_root/src" "$venv_python" \
            "$GITHUB_WORKSPACE/scripts/determinism_matrix.py"

      - name: Install and smoke-test the wheel
        shell: bash
        run: |
          set -euo pipefail
          uv venv .wheel-venv --python "${{ matrix.python-version }}"
          venv_python=".wheel-venv/bin/python"
          mimry_exe=".wheel-venv/bin/mimry"
          if [ -x ".wheel-venv/Scripts/python.exe" ]; then
            venv_python=".wheel-venv/Scripts/python.exe"
            mimry_exe=".wheel-venv/Scripts/mimry.exe"
          fi
          uv pip install --python "$venv_python" dist/*.whl
          "$mimry_exe" --help >/dev/null

  determinism-aggregate:
    name: Compare canonical evidence across every platform
    needs: release-floor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Download every platform artifact
        uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      # The point of the whole exercise. Every OS/Python cell must have produced
      # evidence; all of them must agree on the structural digest AND on the
      # retrieval ranking AND on the context pack; and all three must equal the
      # values committed in the repository. A missing artifact is a failure, not
      # silent agreement.
      - name: Compare digest, rankings, and context across the matrix
        run: |
          python scripts/determinism_aggregate.py \
            --artifacts digests \
            --expect-os ubuntu-latest,macos-latest,windows-latest \
            --expect-python 3.11,3.12,3.13

  benchmark-gate:
    name: Agent usefulness benchmark (frozen quality floors)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync locked environment
        run: uv sync --locked

      # One required job, locked environment, real thresholds. The benchmark is
      # too slow for every matrix cell but must not be informational-only: a
      # ranking or context-pack regression that clears the determinism gate
      # still has to fail here.
      - name: Run the benchmark and require PASS
        run: |
          uv run python scripts/agent_usefulness_benchmark.py --repeat 3 --graph --out benchmarks/result.core.json

      # Without --out the runner prints fresh JSON to stdout and leaves the
      # tracked file untouched, so a stale committed result reads as current.
      # Publish what this run actually measured.
      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-result
          path: benchmarks/result.core.json
          if-no-files-found: error

      - name: Assert the committed report is PASS on the current fixture
        run: uv run pytest -q tests/test_benchmark_quality_gate.py
